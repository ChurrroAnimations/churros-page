<!DOCTYPE html>
<html>
  <head>
    <style>
    #overlay {
      width: 10em;
      height: 10em;
      align-content: center;
      margin: auto;
       text-align: center;
       background-color: green;
  }
    #overlay p {
         margin-top: -1em;
         font-size: 2em;
      }
      #overlay div {
        mix-blend-mode: lighten;
        font-size: 10em;
      }
      #overlay div:first-child {
        margin-top: -0.2em;
        color: black;
      }
      #overlay div:nth-child(2) {
        margin-top: -1.15em;
        color: #f00;
      }
      #overlay div:nth-child(3) {
        margin-top: -1.15em;
        color: #0f0;
      }
      #overlay div:nth-child(4) {
        margin-top: -1.15em;
        color: #00f;
      }
    </style>
  </head>
  <body>
      <div id="overlay">
        <div>
          O
        </div>
        <div>
          0
        </div>
        <div>
          O
        </div>
        <div>
          O
        </div>
        <p>
        Ello
      </p>
      </div>
  </body>
</html>
